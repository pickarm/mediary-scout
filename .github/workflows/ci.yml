name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mediatrack
          POSTGRES_PASSWORD: mediatrack
          POSTGRES_DB: media_track
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mediatrack"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MEDIA_TRACK_POSTGRES_URL: postgresql://mediatrack:mediatrack@localhost:5432/media_track
      # Admin URL for repository-contract-postgres (CREATE/DROP disposable DB).
      MEDIA_TRACK_TEST_POSTGRES_ADMIN_URL: postgresql://mediatrack:mediatrack@localhost:5432/postgres
      # The summary cache suite needs a real Redis and a disposable PostgreSQL DB.
      MEDIA_TRACK_TEST_REDIS_URL: redis://localhost:6379
      # Fail (don't describe.skip) if Postgres/Redis cannot be reached.
      MEDIA_TRACK_CI_REQUIRE_POSTGRES: "1"
      MEDIA_TRACK_CI_REQUIRE_REDIS: "1"

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:workflow
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run typecheck:migration
      - run: npx tsc -p apps/web/tsconfig.json --noEmit
      - run: npx tsc -p apps/desktop/tsconfig.json --noEmit
      - run: npx tsc -p workers/tmdb-proxy/tsconfig.json --noEmit
      - run: npx tsc -p workers/scout-connect/tsconfig.json --noEmit
      # Production build with NO database — mirrors `docker compose build` (no .env
      # at image-build time). cacheComponents prerenders pages at build; any server
      # component that reads the DB outside a connection()/cookies()/searchParams
      # guard crashes here. This step is what catches that class before it reaches a
      # self-hoster's `docker compose up`.
      - run: npm run build:web
        env:
          MEDIA_TRACK_POSTGRES_URL: ""
      - name: Non-PostgreSQL unit suites
        env:
          MEDIA_TRACK_POSTGRES_URL: ""
          MEDIA_TRACK_TEST_POSTGRES_ADMIN_URL: ""
          MEDIA_TRACK_CI_REQUIRE_POSTGRES: ""
          MEDIA_TRACK_TEST_REDIS_URL: ""
          MEDIA_TRACK_CI_REQUIRE_REDIS: ""
        run: >-
          npx vitest run
          --exclude '**/*.pg.test.ts'
          --exclude '**/*.postgres.test.ts'
          --exclude '**/*-postgres.test.ts'
          --exclude 'packages/workflow/src/postgres-schema-init.test.ts'
          --exclude 'packages/workflow/src/library/library-import.test.ts'
          --exclude 'packages/workflow/src/library-scanner.test.ts'
          --exclude 'packages/workflow/tests/fork-migration.test.ts'
          --exclude 'apps/web/lib/workflow-runtime.acquisition-bindings.test.ts'
          --exclude 'apps/web/lib/workflow-runtime.acquisition-naming.test.ts'
      # Every PostgreSQL suite in the repo, wherever it lives. Run files serially to
      # prevent test-only DDL/DML deadlocks while still proving each suite executes.
      - name: PostgreSQL integration suites (all locations)
        shell: bash
        run: |
          mapfile -t pg_tests < <(
            git ls-files '*.pg.test.ts' '*.postgres.test.ts' '*-postgres.test.ts' \
              packages/workflow/src/library/library-import.test.ts \
              packages/workflow/src/library-scanner.test.ts \
              packages/workflow/tests/fork-migration.test.ts \
              apps/web/lib/workflow-runtime.acquisition-bindings.test.ts \
              apps/web/lib/workflow-runtime.acquisition-naming.test.ts \
              | grep -vxF 'packages/workflow/tests/repository-contract-postgres.test.ts' \
              | sort -u
          )
          printf 'PG suites: %s\n' "${#pg_tests[@]}"
          set +e
          npx vitest run --no-file-parallelism --testTimeout=30000 --hookTimeout=30000 "${pg_tests[@]}" 2>&1 | tee /tmp/vitest-pg.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            SUMMARY="$(node -e '
              const fs = require("node:fs");
              const raw = fs.readFileSync(process.argv[1], "utf8").replace(/\x1b\[[0-9;]*m/g, "");
              const lines = raw.split(/\r?\n/);
              const hits = lines.filter((l) => /FAIL |Unhandled|AssertionError|Error:|timed out|Test Files/i.test(l));
              const tail = (hits.length ? hits : lines.slice(-25)).slice(-25).join("\n").slice(0, 1800);
              process.stdout.write(tail.replace(/%/g, "%25").replace(/\r/g, "%0D").replace(/\n/g, "%0A"));
            ' /tmp/vitest-pg.log)"
            printf '::error title=PostgreSQL integration suites failed::%s\n' "${SUMMARY:-exit code $status}"
            exit "$status"
          fi
      # MEDIA_TRACK_CI_REQUIRE_POSTGRES=1 makes the contract hard-fail if it cannot
      # reach/provision Postgres (vitest alone exits 0 on pure describe.skip).
      - name: Repository contract and schema init (PostgreSQL)
        shell: bash
        run: |
          set +e
          npx vitest run --no-file-parallelism --testTimeout=30000 --hookTimeout=30000 packages/workflow/tests/repository-contract-postgres.test.ts packages/workflow/src/postgres-schema-init.test.ts 2>&1 | tee /tmp/vitest-pg-contract.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            SUMMARY="$(node -e '
              const fs = require("node:fs");
              const raw = fs.readFileSync(process.argv[1], "utf8").replace(/\x1b\[[0-9;]*m/g, "");
              const lines = raw.split(/\r?\n/);
              const hits = lines.filter((l) => /FAIL |Unhandled|AssertionError|Error:|timed out|Test Files/i.test(l));
              const tail = (hits.length ? hits : lines.slice(-25)).slice(-25).join("\n").slice(0, 1800);
              process.stdout.write(tail.replace(/%/g, "%25").replace(/\r/g, "%0D").replace(/\n/g, "%0A"));
            ' /tmp/vitest-pg-contract.log)"
            printf '::error title=Repository contract Postgres suites failed::%s\n' "${SUMMARY:-exit code $status}"
            exit "$status"
          fi

  image-smoke:
    needs: build-and-test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mediatrack
          POSTGRES_PASSWORD: mediatrack
          POSTGRES_DB: media_track
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mediatrack"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7
      - name: Build the same Dockerfile used by the Fork release
        run: |
          docker build \
            --build-arg GIT_SHA="${GITHUB_SHA}" \
            --build-arg VERSION=ci \
            -t xunying-ci .
      # Isolated database, fake adapters, no real drive, no background worker: this
      # proves the image boots and serves /api/health without touching a 网盘.
      - name: Start with fake adapters and workers disabled
        run: |
          docker run -d --name xunying-smoke --network host \
            -e MEDIA_TRACK_POSTGRES_URL=postgresql://mediatrack:mediatrack@127.0.0.1:5432/media_track \
            -e MEDIA_TRACK_REHEARSAL=1 \
            -e MEDIA_TRACK_INPROCESS_WORKER=0 \
            -e MEDIA_TRACK_DISTRIBUTION=fork-image \
            -e MEDIA_TRACK_WORKFLOW_ADAPTER=fake \
            -e MEDIA_TRACK_AGENT_ADAPTER=fake \
            -e MEDIA_TRACK_STORAGE_ADAPTER=fake \
            -e MEDIA_TRACK_SEARCH_PROVIDER=demo \
            -e MEDIA_TRACK_DEMO_SEED=0 \
            xunying-ci
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/api/health >/dev/null; then
              echo "image health OK"
              exit 0
            fi
            sleep 2
          done
          echo "image did not become healthy" >&2
          docker logs xunying-smoke >&2
          exit 1
      - name: Remove the smoke container
        if: always()
        run: docker rm -f xunying-smoke || true
