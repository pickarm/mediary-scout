# 巡影 Fork 默认部署：默认拉取 GHCR 自动构建发布的 linux/amd64 应用镜像。
#
#   cp .env.example .env      # 填 MEDIA_TRACK_POSTGRES_URL / PANSOU_BASE_URL / REDIS_URL
#   docker compose -f docker-compose.fork.yml up -d
#
# 外部 PostgreSQL、Redis（可选）与 PanSou 由用户已有服务提供。本文件：
#   * 没有 build 段，不编译源码
#   * 没有源码挂载
#   * 不挂 Docker socket，也不启动旧本地构建 updater
# 默认拉取 ghcr.io/pickarm/mediary-scout:latest（可设 MEDIA_TRACK_IMAGE_TAG=edge / v2026.11.26 或用 MEDIA_TRACK_IMAGE 覆盖镜像源）。

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  web:
    image: ${MEDIA_TRACK_IMAGE:-ghcr.io/pickarm/mediary-scout}:${MEDIA_TRACK_IMAGE_TAG:-latest}
    platform: linux/amd64
    # 外部服务地址必须显式提供；不在这里私自内置数据库或 PanSou。
    environment:
      MEDIA_TRACK_POSTGRES_URL: ${MEDIA_TRACK_POSTGRES_URL:?set MEDIA_TRACK_POSTGRES_URL to your external PostgreSQL}
      REDIS_URL: ${REDIS_URL:-}
      PANSOU_BASE_URL: ${PANSOU_BASE_URL:?set PANSOU_BASE_URL to your external PanSou}
      # 预构建镜像标记：更新入口展示 pull/recreate，后台不启用旧源码 updater。
      MEDIA_TRACK_DISTRIBUTION: fork-image
      MEDIA_TRACK_SEARCH_PROVIDER: ${MEDIA_TRACK_SEARCH_PROVIDER:-tmdb}
      MEDIA_TRACK_WORKFLOW_ADAPTER: ${MEDIA_TRACK_WORKFLOW_ADAPTER:-pansou}
      # 光鸭连接在设置页创建；该适配器开关是原「真实存储模式」的兼容名称。
      MEDIA_TRACK_STORAGE_ADAPTER: ${MEDIA_TRACK_STORAGE_ADAPTER:-115}
      MEDIA_TRACK_AGENT_ADAPTER: ${MEDIA_TRACK_AGENT_ADAPTER:-vercel-ai}
      MEDIA_TRACK_DEMO_SEED: "0"
      MEDIA_TRACK_ALLOWED_ORIGINS: ${MEDIA_TRACK_ALLOWED_ORIGINS:-}
      MEDIA_TRACK_ADMIN_USERNAME: ${MEDIA_TRACK_ADMIN_USERNAME:-}
      MEDIA_TRACK_ADMIN_PASSWORD: ${MEDIA_TRACK_ADMIN_PASSWORD:-}
      MEDIA_TRACK_ALLOW_REGISTRATION: ${MEDIA_TRACK_ALLOW_REGISTRATION:-}
      MEDIA_TRACK_DISABLE_WEB_BOOTSTRAP: ${MEDIA_TRACK_DISABLE_WEB_BOOTSTRAP:-}
      MEDIA_TRACK_COOKIE_SECURE: ${MEDIA_TRACK_COOKIE_SECURE:-}
      MEDIA_TRACK_SUMMARY_CACHE_NAMESPACE: ${MEDIA_TRACK_SUMMARY_CACHE_NAMESPACE:-mediary-scout}
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-}
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    env_file:
      - path: .env
        required: false
    ports:
      - "${WEB_PORT:-3000}:3000"
    healthcheck:
      test:
        - CMD-SHELL
        - node -e "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    logging: *default-logging
    restart: unless-stopped
